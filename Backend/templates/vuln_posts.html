<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stored XSS 취약 게시판</title>
</head>
<body>

<h1>Stored XSS 취약 게시판</h1>

<p>※ 게시글 내용을 escaping 없이 출력하는 취약한 페이지입니다.</p>

<hr>

{% for post in posts %}

    <h3>
        [ID : {{ post[0] }}]
        {{ post[1] }}
    </h3>

    {{ post[2]|safe }}

    <br><br>

    <small>
        작성자 : {{ post[3] }}

        {% if current_user_id and post[4] == current_user_id %}
            <span style="color:green;">(내 글)</span>
        {% else %}
            <span style="color:red;">(다른 사용자 글)</span>
        {% endif %}

    </small>

    <hr>

{% endfor %}

</body>
</html>
