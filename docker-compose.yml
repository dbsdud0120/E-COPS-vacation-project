version: "3.9"

services:

  # 취약 웹 서비스 및 REST API
  backend:
    build:
      context: ./Backend
    container_name: vulnerable-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      FLASK_ENV: development
      MYSQL_HOST: db
      MYSQL_DATABASE: security_db
      MYSQL_USER: security
      MYSQL_PASSWORD: security123
      SECRET_KEY: evulnscanner-secret-key
      JWT_SECRET: evulnscanner-jwt-secret

    # DB가 먼저 실행된 후 backend 실행
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - security-network

  # 웹/API 자동 진단 엔진 
  scanner:
    build:
      context: ./Scanner
    container_name: security-scanner
    expose:
      - "5001"
    volumes:
      - scanner-results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - security-network

  # 결과 분석 및 Dashboard
  report:
    build:
      context: ./Report
    container_name: report-generator
    expose:
      - "5002"
    volumes:
      - scanner-results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - security-network

  # 사용자 UI 및 Scanner/Report 실행 제어 플랫폼
  platform:
    build:
      context: ./Platform
    container_name: security-platform
    expose:
      - "8080" # Nginx가 내부에서 접근할 포트
    volumes:
      - scanner-results:/app/results
      - ./Scanner:/app/scanner
      - ./Report:/app/report
    depends_on:
      backend:
        condition: service_healthy
      scanner:
        condition: service_healthy
      report:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - security-network

  # Nginx 리버스 프록시
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80" # 외부 HTTP 80 포트를 Nginx 80 포트로 바인딩
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - security-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: security_db
      MYSQL_USER: security
      MYSQL_PASSWORD: security123
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # DB 컨테이너 헬스체크 설정
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - security-network

# Docker Volume
volumes:
  mysql-data:
  scanner-results:

# Docker Network
networks:
  security-network:
    driver: bridge
