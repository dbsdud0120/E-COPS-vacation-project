version: "3.9"

services:

  # 취약 웹 서비스 및 REST API
  backend:
    build:
      context: ./Backend
    container_name: vulnerable-backend
    expose:
      - "5000"
    environment:
      FLASK_ENV: development
      MYSQL_HOST: db
      MYSQL_DATABASE: security_db
      MYSQL_USER: security
      MYSQL_PASSWORD: security123
    depends_on:
      - db
    networks:
      - security-network

  # 웹/API 자동 진단 엔진 
  scanner:
    build:
      context: ./Scanner
    container_name: security-scanner
    expose:
      - "5001"
    volumes:
      - scanner-results:/app/results
    networks:
      - security-network

  # 결과 분석 및 Dashboard
  report:
    build:
      context: ./Report
    container_name: report-generator
    expose:
      - "5002"
    volumes:
      - scanner-results:/app/results
    networks:
      - security-network

  # 사용자 UI 및 Scanner/Report 실행 제어 플랫폼
  platform:
    build:
      context: ./Platform
    container_name: security-platform
    expose:
      - "8080" # Nginx가 내부에서 접근할 포트
    volumes:
      - scanner-results:/app/results
      - ./Scanner:/app/scanner
      - ./Report:/app/report
    depends_on:
      - backend
      - scanner
      - report
    networks:
      - security-network

  # Nginx 리버스 프록시
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80" # 외부 HTTP 80 포트를 Nginx 80 포트로 바인딩
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - platform
    networks:
      - security-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: security_db
      MYSQL_USER: security
      MYSQL_PASSWORD: security123
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - security-network

# Docker Volume
volumes:
  mysql-data:
  scanner-results:

# Docker Network
networks:
  security-network:
    driver: bridge
